<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provas Antigas</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec;
    --accent:#0f6e6e; --accent-soft:#e3f2f1; --ok:#1a7f37; --ok-soft:#e7f6ea;
    --bad:#b42318; --bad-soft:#fdecea; --warn:#9a6700; --warn-soft:#fff5d6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111418; --card:#1a1f26; --text:#e6e8eb; --muted:#9aa4b2; --line:#2b323c;
      --accent:#4fc1bd; --accent-soft:#16302f; --ok:#4ac26b; --ok-soft:#15291b;
      --bad:#f47067; --bad-soft:#3a1d1b; --warn:#e3b341; --warn-soft:#332a12;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  header.top h1{font-size:20px;margin:0}
  header.top a{color:inherit;text-decoration:none}
  .muted{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .prova-link{display:block;color:inherit;text-decoration:none;transition:border-color .15s}
  .prova-link:hover{border-color:var(--accent)}
  .prova-link h2{margin:0 0 4px;font-size:16px}
  .badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);margin-right:6px}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.bad{background:var(--bad-soft);color:var(--bad)}
  .turma-banner{background:var(--accent-soft);color:var(--accent);border-radius:10px;
    padding:10px 14px;font-weight:600;margin-bottom:14px}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin-bottom:6px;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .bar .score{font-weight:600;margin-right:auto}
  button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .q-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .q-num{font-weight:700}
  .sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 2px}
  .txt{white-space:pre-line;margin:0}
  .alts{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
  .alt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font-size:14.5px;line-height:1.45}
  .alt b{min-width:18px}
  .alt:disabled{cursor:default}
  .alt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .alt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .feedback{margin-top:10px;font-weight:600}
  .feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
  details .txt{margin-top:6px;font-size:14px}
  textarea{width:100%;min-height:70px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:14px;resize:vertical}
  .img-flag{display:flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);
    border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;margin-bottom:8px}
  h3.group{font-size:15px;margin:22px 0 10px}
  .empty{padding:30px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="#">Provas Antigas</a></h1>
    <span class="muted" id="sub"></span>
  </header>
  <main id="app"><p class="muted">Carregando…</p></main>
</div>

<script>
const app = document.getElementById('app');
const sub = document.getElementById('sub');
let indice = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const turmaTxt = p => `Turma ${p.turma}${p.periodo ? ' · ' + p.periodo : ''}`;
const imgIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

async function carregarIndice(){
  if (indice) return indice;
  const r = await fetch('data/index.json'); indice = await r.json(); return indice;
}

async function rota(){
  try{
    const id = decodeURIComponent(location.hash.slice(1));
    const idx = await carregarIndice();
    const meta = idx.provas.find(p => p.id === id);
    meta ? await telaProva(meta) : telaInicio(idx);
  }catch(e){
    app.innerHTML = `<div class="card empty">Não foi possível carregar os dados.<br><span class="muted">
      Se você abriu o arquivo direto do computador, rode um servidor local ou publique o site
      (ex.: GitHub Pages).</span></div>`;
  }
  window.scrollTo(0,0);
}

function telaInicio(idx){
  sub.textContent = `${idx.provas.length} prova(s)`;
  app.innerHTML = idx.provas.map(p => `
    <a class="card prova-link" href="#${encodeURIComponent(p.id)}">
      <h2>${esc(p.disciplina)} · ${esc(p.avaliacao)}</h2>
      <span class="badge">${esc(turmaTxt(p))}</span>
      <span class="muted">${p.n_fechadas} fechadas · ${p.n_abertas} abertas</span>
    </a>`).join('') || '<div class="card empty muted">Nenhuma prova cadastrada.</div>';
}

async function telaProva(meta){
  const prova = await (await fetch(meta.arquivo)).json();
  sub.textContent = prova.sigla || '';
  const fech = prova.questoes.filter(q => q.tipo === 'fechada');
  const abe  = prova.questoes.filter(q => q.tipo === 'aberta');
  const resp = {};

  app.innerHTML = `
    <div class="turma-banner">Prova realizada pela ${esc(turmaTxt(prova))}</div>
    <h2 style="margin:0 0 4px;font-size:18px">${esc(prova.disciplina)} · ${esc(prova.avaliacao)}</h2>
    <p class="muted" style="margin:0 0 12px">${fech.length} questões fechadas e ${abe.length} abertas. Clique numa alternativa para corrigir.</p>
    <div class="bar">
      <span class="score" id="score"></span>
      <button data-f="todas" class="on">Todas</button>
      <button data-f="erradas">Erradas</button>
      <button data-f="pendentes">Não respondidas</button>
      <button id="reset">Recomeçar</button>
    </div>
    <h3 class="group">Questões fechadas</h3>
    <div id="fech">${fech.map(cardFechada).join('')}</div>
    ${abe.length ? `<h3 class="group">Questões abertas</h3><div id="abe">${abe.map(cardAberta).join('')}</div>` : ''}
  `;

  const score = () => {
    const n = Object.keys(resp).length, ok = Object.values(resp).filter(Boolean).length;
    document.getElementById('score').textContent = `Acertos: ${ok}/${n} · respondidas ${n}/${fech.length}`;
  };
  score();

  app.querySelectorAll('.alt').forEach(b => b.addEventListener('click', () => {
    const card = b.closest('.q'); const n = card.dataset.n;
    const q = fech.find(x => String(x.numero) === n);
    const acertou = b.dataset.l === q.gabarito;
    resp[n] = acertou;
    card.querySelectorAll('.alt').forEach(a => {
      a.disabled = true;
      if (a.dataset.l === q.gabarito) a.classList.add('correct');
      else if (a === b) a.classList.add('wrong');
    });
    const fb = card.querySelector('.feedback');
    fb.className = 'feedback ' + (acertou ? 'ok' : 'no');
    fb.textContent = acertou ? 'Você acertou!' : `Resposta correta: ${q.gabarito}`;
    fb.hidden = false;
    const j = card.querySelector('details'); if (j) j.hidden = false;
    card.dataset.st = acertou ? 'ok' : 'no';
    score();
  }));

  app.querySelectorAll('.bar [data-f]').forEach(b => b.addEventListener('click', () => {
    app.querySelectorAll('.bar [data-f]').forEach(x => x.classList.toggle('on', x === b));
    const f = b.dataset.f;
    app.querySelectorAll('#fech .q').forEach(c => {
      const st = c.dataset.st;
      c.hidden = f === 'erradas' ? st !== 'no' : f === 'pendentes' ? !!st : false;
    });
  }));
  document.getElementById('reset').onclick = () => telaProva(meta);
}

function blocoComum(q, extra=''){
  return `
    <div class="q-head">
      <span class="q-num">Questão ${q.numero}</span>
      ${q.observacao ? `<span class="badge">${esc(q.observacao)}</span>` : ''}
      ${q.anulada ? '<span class="badge bad">Anulada</span>' : ''}
      ${extra}
    </div>
    ${q.imagem ? `<div class="img-flag">${imgIcon}<span>Esta questão contém imagem no original${q.imagem_descricao ? ': ' + esc(q.imagem_descricao) : ''}.</span></div>` : ''}
    ${q.situacao ? `<div class="sec">Situação-problema</div><p class="txt">${esc(q.situacao)}</p>` : ''}
    <div class="sec">Comando</div><p class="txt">${esc(q.comando)}</p>`;
}

function cardFechada(q){
  return `<article class="card q" data-n="${q.numero}">
    ${blocoComum(q)}
    <ul class="alts">${Object.entries(q.alternativas).map(([l,t]) =>
      `<li><button class="alt" data-l="${l}"><b>${l}</b><span>${esc(t)}</span></button></li>`).join('')}</ul>
    <div class="feedback" hidden></div>
    ${q.justificativa ? `<details hidden><summary>Ver justificativa</summary><p class="txt">${esc(q.justificativa)}</p></details>` : ''}
  </article>`;
}

function cardAberta(q){
  return `<article class="card q">
    ${blocoComum(q)}
    <textarea placeholder="Escreva sua resposta (não é salva)…"></textarea>
    <details><summary>Mostrar resposta esperada</summary><p class="txt">${esc(q.resposta_esperada)}</p></details>
  </article>`;
}

window.addEventListener('hashchange', rota);
rota();
</script>
</body>
</html>
